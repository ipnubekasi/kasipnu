<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e3a28">
<title>Sedang offline · Kas IPNU</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;min-height:100dvh;display:grid;place-items:center;padding:24px;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:#14241b;background:radial-gradient(700px 400px at 0% 0%,#c5e6d2,transparent 60%),radial-gradient(600px 360px at 100% 0%,#ffeebe,transparent 60%),#f3f7f4}
  main{max-width:360px;text-align:center;background:rgba(255,255,255,.8);border:1px solid #e4ebe6;border-radius:28px;padding:32px 24px;box-shadow:0 18px 44px -14px rgba(14,58,40,.28)}
  img{width:72px;height:72px}
  h1{font-size:20px;margin:16px 0 8px}
  p{margin:0 0 20px;color:#55645b;line-height:1.55;font-size:15px}
  button{height:48px;padding:0 24px;border:0;border-radius:14px;background:#15724a;color:#fff;font-size:15px;font-weight:600}
</style>
</head>
<body>
<main>
  <img src="/logo-ipnu.png" alt="Logo IPNU">
  <h1>Anda sedang offline</h1>
  <p>Kas IPNU membutuhkan koneksi internet agar angka keuangan selalu terbaru dan aman. Periksa sinyal atau Wi-Fi, lalu coba lagi.</p>
  <button type="button" onclick="location.reload()">Coba lagi</button>
</main>
</body>
</html>
